
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Instagram</title>

    <style>
        :root {
            color-scheme: light;
            --background: #fafafa;
            --surface: #ffffff;
            --input-background: #fafafa;
            --border: #dbdbdb;
            --text: #262626;
            --secondary: #8e8e8e;
            --facebook: #385185;
            --forgot: #00376b;
            --blue: #0095f6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --background: #000000;
                --surface: #000000;
                --input-background: #121212;
                --border: #363636;
                --text: #f5f5f5;
                --secondary: #a8a8a8;
                --facebook: #8ab4f8;
                --forgot: #8ab4f8;
                --blue: #0095f6;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px 0;
            transition: background-color 0.25s ease,
                        color 0.25s ease;
        }

        .container {
            width: 350px;
            max-width: 100%;
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            margin-bottom: 10px;
            transition: background-color 0.25s ease,
                        border-color 0.25s ease;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo svg {
            width: 90px;
            height: 90px;
        }

        .input-field {
            display: block;
            width: 100%;
            padding: 12px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background-color: var(--input-background);
            color: var(--text);
            font-size: 12px;
            outline: none;
            margin-bottom: 6px;
            transition: background-color 0.25s ease,
                        color 0.25s ease,
                        border-color 0.25s ease;
        }

        .input-field::placeholder {
            color: var(--secondary);
            opacity: 1;
        }

        .input-field:focus {
            border-color: var(--secondary);
        }

        .button {
            width: 100%;
            padding: 8px 16px;
            background-color: var(--blue);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .button:hover {
            filter: brightness(0.95);
        }

        .or-divider {
            display: flex;
            align-items: center;
            color: var(--secondary);
            margin: 20px 0;
            font-size: 13px;
            font-weight: 600;
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .or-divider::before {
            margin-right: 18px;
        }

        .or-divider::after {
            margin-left: 18px;
        }

        .facebook-login {
            color: var(--facebook);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
        }

        .facebook-login svg {
            margin-right: 8px;
            flex-shrink: 0;
        }

        .forgot-password {
            color: var(--forgot);
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-top: 12px;
        }

        .signup-container {
            width: 350px;
            max-width: 100%;
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: background-color 0.25s ease,
                        border-color 0.25s ease;
        }

        .signup-text {
            font-size: 14px;
            color: var(--text);
        }

        .signup-link {
            color: var(--blue);
            font-weight: 600;
            text-decoration: none;
        }

        .app-download {
            text-align: center;
            margin-top: 10px;
        }

        .app-download-text {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 15px;
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .app-buttons img {
            height: 40px;
            max-width: 145px;
            object-fit: contain;
            cursor: pointer;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        @media (max-width: 400px) {
            body {
                padding: 0;
            }

            .container,
            .signup-container {
                width: 100%;
                border-left: none;
                border-right: none;
                background-color: var(--background);
            }

            .container {
                border-top: none;
                padding: 40px;
            }

            .signup-container {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo" aria-label="Instagram">

                <circle fill="url(#instaGradient)"
                    cx="18.4" cy="5.6" r="1.44"/>
            </svg>
        </div>

        <form id="login-form">
            <input
                name="email"
                class="input-field"
                type="text"
                placeholder="Phone number, username, or email"
                aria-label="Nome de usuário ou e-mail"
                autocomplete="username"
                required>

            <input
                name="password"
                class="input-field"
                type="password"
                placeholder="Password"
                aria-label="Senha"
                autocomplete="current-password"
                required>

            <button type="submit" class="button">
                Log in
            </button>

            <p id="form-message"
               role="status"
               aria-live="polite"
               style="font-size:12px;margin-top:12px">
            </p>
        </form>

        <div class="or-divider">OR</div>

        <a href="https://www.facebook.com/"
           class="facebook-login"
           target="_blank"
           rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="16" height="16"
                 fill="currentColor"
                 viewBox="0 0 24 24"
                 aria-hidden="true">

            Log in with Facebook
        </a>

        <a href="https://www.instagram.com/accounts/password/reset/"
           class="forgot-password">
            Forgot password?
        </a>
    </main>

    <section class="signup-container">
        <p class="signup-text">
            Don't have an account?
            <a href="https://www.instagram.com/accounts/emailsignup/"
               class="signup-link">
                Sign up
            </a>
        </p>
    </section>

    <footer class="app-download">
        <p class="app-download-text">Get the app.</p>

        <div class="app-buttons">
            <a href="https://apps.apple.com/app/instagram/id389801252"
               target="_blank"
               rel="noopener noreferrer">
                <img
                    src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png"
                    alt="Download on the App Store">
            </a>

            <a href="https://play.google.com/store/apps/details?id=com.instagram.android"
               target="_blank"
               rel="noopener noreferrer">
                <img
                    src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png"
                    alt="Get it on Google Play">
            </a>
        </div>
    </footer>

    <script>
        // Detecta o tema atual do sistema operacional.
        const themePreference = window.matchMedia(
            "(prefers-color-scheme: dark)"
        );

        function updateTheme() {
            document.documentElement.dataset.theme =
                themePreference.matches ? "dark" : "light";

            console.log(
                "Tema detectado:",
                themePreference.matches ? "escuro" : "claro"
            );
        }

        updateTheme();

        // Atualiza automaticamente quando o sistema muda de tema.
        if (themePreference.addEventListener) {
            themePreference.addEventListener("change", updateTheme);
        } else {
            themePreference.addListener(updateTheme);
        }

        // Demonstração visual: não envia nem armazena credenciais.
        document.getElementById("login-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("form-message").textContent =
                    "Demonstração visual: nenhum dado foi enviado.";
            });
    </script>
</body>
</html>
